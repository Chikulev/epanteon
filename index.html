<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НАСЛЕДИЕ | THE ARCHIVE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Oswald:wght@300;400;500;700&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #F4F4F0; 
            --text: #111111; 
            --text-dim: #767676;
            --accent: #D92525; 
            --line: rgba(0, 0, 0, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Кастомный курсор */
        }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar { display: none; }

        body.no-scroll {
            overflow: hidden;
        }

        /* --- ЭФФЕКТ ДОРОГОЙ БУМАГИ (ШУМ) --- */
        .noise {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- ИНДИКАТОР ПРОГРЕССА --- */
        .progress-line {
            position: fixed;
            top: 0; right: 0;
            width: 3px; height: 0%;
            background-color: var(--accent);
            z-index: 9998;
            transition: height 0.15s ease-out;
        }

        /* --- КНОПКА НАВЕРХ --- */
        .back-to-top {
            position: fixed;
            bottom: 40px; right: 40px;
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--bg);
            display: flex; justify-content: center; align-items: center;
            z-index: 9000;
            opacity: 0; visibility: hidden;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .back-to-top.visible {
            opacity: 1; visibility: visible; transform: translateY(0);
        }
        .back-to-top::before {
            content: ''; width: 15px; height: 15px;
            border-top: 2px solid var(--text);
            border-left: 2px solid var(--text);
            transform: rotate(45deg) translate(2px, 2px);
        }
        .back-to-top:hover { border-color: var(--text); }

        /* --- КАСТОМНЫЙ КУРСОР-ЛИНЗА --- */
        .cursor-dot {
            position: fixed;
            top: 0; left: 0;
            width: 12px; height: 12px;
            background-color: var(--text);
            border-radius: 50%;
            pointer-events: none;
            z-index: 20000;
            transform: translate(-50%, -50%);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        height 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        background-color 0.4s;
            will-change: transform, width, height;
        }
        
        .cursor-dot.active {
            width: 90px; height: 90px;
            background-color: transparent;
            backdrop-filter: invert(1) grayscale(100%);
            -webkit-backdrop-filter: invert(1) grayscale(100%);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* --- СТРУКТУРА (ШВЕЙЦАРСКАЯ СЕТКА) --- */
        .grid-layout {
            display: flex;
            width: 100%;
        }

        /* --- ЛЕВАЯ ПАНЕЛЬ (ФИКСИРОВАННАЯ) --- */
        .left-col {
            width: 45%;
            height: 100vh;
            position: sticky;
            top: 0;
            padding: 5vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid var(--line);
            overflow: hidden;
        }

        .bg-number {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Oswald', sans-serif;
            font-size: 45vw;
            font-weight: 700;
            color: rgba(0,0,0,0.03);
            line-height: 1;
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.5s ease;
        }

        .title-wrapper {
            position: relative;
            z-index: 1;
            min-height: 35vh; 
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
        }

        .category-label {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .category-label::before {
            content: '';
            width: 30px; height: 1px;
            background-color: var(--accent);
        }

        .category-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 5vw, 6.5rem);
            font-weight: 400;
            line-height: 0.95;
            display: flex;
            flex-wrap: wrap;
            gap: 0; 
        }
        
        .word {
            display: flex;
            overflow: hidden;
            padding-bottom: 0.2em;
            margin-bottom: -0.2em;
        }
        
        .word.space {
            width: 0.25em;
        }

        .char {
            display: inline-block;
            transform: translateY(110%);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s;
            will-change: transform;
        }
        .char.visible {
            transform: translateY(0);
            opacity: 1;
        }

        /* --- ПРАВАЯ ПАНЕЛЬ (НАТИВНЫЙ СКРОЛЛ) --- */
        .right-col {
            width: 55%;
            padding: 0 5vw 20vh 5vw;
        }

        .intro-block {
            padding-top: 25vh;
            margin-bottom: 15vh;
        }
        .intro-title {
            font-family: 'Oswald', sans-serif;
            font-size: 3rem;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }
        .intro-text {
            font-size: 1.25rem;
            line-height: 1.7;
            color: var(--text-dim);
            margin-bottom: 3rem;
            max-width: 95%;
        }
        .intro-stats {
            font-family: 'Oswald', sans-serif;
            color: var(--accent);
            margin-bottom: 3rem;
            font-size: 1.2rem;
            letter-spacing: 1.5px;
        }

        .toc-list {
            list-style: none;
            border-top: 1px solid var(--text);
        }
        .toc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 0;
            border-bottom: 1px solid var(--line);
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            transition: color 0.3s, padding-left 0.3s;
            text-decoration: none;
            color: var(--text);
        }
        .toc-item:hover {
            color: var(--accent);
            padding-left: 20px;
        }
        .toc-num {
            font-size: 1rem;
            color: var(--text-dim);
        }

        .section-block {
            padding-top: 10vh;
            margin-bottom: 10vh;
        }

        .section-divider {
            margin-bottom: 4rem;
            padding-bottom: 1.5rem;
            border-bottom: 4px solid var(--text);
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .section-divider span {
            font-size: 1.6rem;
            color: var(--text);
            font-weight: 700;
        }

        .item-row {
            position: relative;
            padding: 3vw 0;
            border-bottom: 1px solid var(--line);
            overflow: hidden;
        }
        .item-row::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--text);
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.7, 0, 0.2, 1);
            z-index: 0;
        }
        .item-row:hover::before {
            transform: scaleY(1);
            transform-origin: top;
        }

        .item-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            transition: color 0.3s;
        }
        .item-row:hover .item-content { color: var(--bg); }
        .item-row:hover .item-desc { color: rgba(255,255,255,0.7); }
        .item-row:hover .item-index { color: var(--accent); }

        .item-header {
            display: flex;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 1rem;
        }

        .item-index {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            color: var(--text-dim);
            font-weight: 300;
            transition: color 0.3s;
            margin-left: 10px;
        }

        .item-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2.2rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .item-header-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .item-achievement {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            color: var(--accent); /* Красный акцентный цвет */
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .item-desc {
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--text-dim);
            font-weight: 400;
            max-width: 90%;
            margin-left: calc(1.1rem + 20px); 
            transition: color 0.3s;
        }

        #status-msg {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            text-align: center;
            margin-top: 30vh;
            color: var(--text-dim);
        }

        /* --- OVERLAY ДЕТАЛЕЙ (SINGLE PAGE APPLICATION) --- */
        .detail-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: var(--bg);
            z-index: 15000;
            display: flex;
            transform: translateY(100%);
            transition: transform 0.7s cubic-bezier(0.7, 0, 0.2, 1);
            will-change: transform;
        }
        .detail-overlay.active {
            transform: translateY(0);
        }
        
        .detail-close {
            position: absolute;
            top: 40px; right: 5vw;
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text);
            z-index: 2;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .detail-close::after {
            content: '';
            width: 30px; height: 1px;
            background: var(--text);
            transition: width 0.3s;
        }
        .detail-close:hover::after { width: 50px; }

        .detail-photo-col {
            width: 45%; height: 100%;
            border-right: 1px solid var(--line);
            display: flex; justify-content: center; align-items: center;
            padding: 5vw;
            background: #EBEBE6;
        }
        .detail-photo {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: filter 0.5s;
        }
        .detail-photo:hover { filter: grayscale(0%); }

        .detail-text-col {
            width: 55%; height: 100%;
            padding: 15vh 5vw;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .detail-text-col::-webkit-scrollbar { display: none; }
        
        .detail-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(4rem, 6vw, 7rem);
            line-height: 0.95;
            margin-bottom: 2rem;
        }
        .detail-invention {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 3rem;
            display: block;
            border-bottom: 1px solid var(--line);
            padding-bottom: 1rem;
        }
        .detail-full-desc {
            font-size: 1.3rem;
            line-height: 1.7;
            color: var(--text);
            font-weight: 400;
        }

        .search-container {
            margin-top: 2rem;
            z-index: 1;
        }
        #archive-search {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--text-dim);
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            color: var(--text);
            width: 100%;
            padding: 10px 0;
            outline: none;
            transition: border-color 0.3s;
        }
        #archive-search:focus {
            border-color: var(--accent);
        }
        #archive-search::placeholder {
            color: var(--text-dim);
            opacity: 0.5;
        }

        /* --- АДАПТИВ --- */
        @media (max-width: 900px) {
            .grid-layout { flex-direction: column; }
            .left-col { width: 100%; height: auto; min-height: 35vh; padding: 30px; border-right: none; border-bottom: 1px solid var(--line); z-index: 10; background: var(--bg); }
            .bg-number { font-size: 60vw; }
            .title-wrapper { min-height: auto; }
            .category-title { font-size: 3rem; }
            .right-col { width: 100%; padding: 0 20px; }
            .section-block { padding-top: 5vh; margin-bottom: 5vh; }
            .section-divider { margin-top: 5vh; }
            .item-desc { margin-left: 0; margin-top: 10px; max-width: 100%; }
            .item-header { flex-direction: column; gap: 5px; }
            .progress-line { display: none; }
            
            /* Адаптив оверлея */
            .detail-overlay { flex-direction: column; }
            .detail-photo-col { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid var(--line); padding: 0; }
            .detail-photo { border-radius: 0; }
            .detail-text-col { width: 100%; height: 60vh; padding: 30px; }
            .detail-title { font-size: 3rem; }
            .detail-close { top: 20px; right: 20px; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 20px; padding: 5px 15px; }
            .back-to-top { bottom: 20px; right: 20px; width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

<div class="noise"></div>
<div class="progress-line" id="progress-line"></div>
<div class="cursor-dot" id="cursor-dot"></div>

<div class="back-to-top interactive-item" id="back-to-top"></div>

<div class="detail-overlay" id="detail-overlay">
    <div class="detail-close interactive-item" id="detail-close">К АРХИВУ</div>
    <div class="detail-photo-col">
        <img src="" alt="" class="detail-photo" id="detail-photo">
    </div>
    <div class="detail-text-col">
        <h2 class="detail-title" id="detail-title"></h2>
        <span class="detail-invention" id="detail-invention"></span>
        <p class="detail-full-desc" id="detail-full-desc"></p>
    </div>
</div>

<div class="grid-layout">
    
    <div class="left-col">
        <div class="bg-number" id="bg-number">00</div>
        
        <div class="title-wrapper">
            <div class="category-label"><span id="cat-counter">ОГЛАВЛЕНИЕ</span></div>
            <h1 class="category-title" id="category-title">
                </h1>
        </div>
        <div class="search-container">
            <input type="text" id="archive-search" placeholder="Поиск имен...">
        </div>
    </div>

    <div class="right-col" id="right-col">
        <div id="status-msg">Инициализация архива...</div>
    </div>
    
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        
        // --- 1. КУРСОР ---
        const cursorDot = document.getElementById('cursor-dot');
        let mouseX = -100, mouseY = -100;
        let dotX = -100, dotY = -100;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function renderCursor() {
            dotX += (mouseX - dotX) * 0.2;
            dotY += (mouseY - dotY) * 0.2;
            cursorDot.style.transform = `translate(${dotX}px, ${dotY}px)`;
            requestAnimationFrame(renderCursor);
        }
        renderCursor();

        document.body.addEventListener('mouseover', (e) => {
            if (e.target.closest('.interactive-item')) cursorDot.classList.add('active');
        });
        document.body.addEventListener('mouseout', (e) => {
            if (e.target.closest('.interactive-item')) cursorDot.classList.remove('active');
        });

        // --- 2. ПРОГРЕСС БАР И КНОПКА НАВЕРХ ---
        const progressLine = document.getElementById('progress-line');
        const backToTopBtn = document.getElementById('back-to-top');

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.body.scrollHeight - window.innerHeight;
            if (docHeight > 0) {
                const scrolled = (scrollTop / docHeight) * 100;
                progressLine.style.height = `${scrolled}%`;
            }
            
            if (scrollTop > window.innerHeight) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // --- 3. ЗАГРУЗКА ДАННЫХ И ПОСТРОЕНИЕ ДОМ ---
        const rightCol = document.getElementById('right-col');
        const statusMsg = document.getElementById('status-msg');
        let globalIndex = 1;
        
        // База данных для оверлея
        const itemsDatabase = {};

        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                statusMsg.style.display = 'none';
                renderIntro(data);
                renderData(data);
                
                initIntersectionObserver();
                updateLeftPanel("Введение", 0);
            })
            .catch(err => {
                statusMsg.innerHTML = `ОШИБКА АРХИВА<br><small style="font-size:1rem; text-transform:none;">Необходим локальный сервер.<br>${err.message}</small>`;
            });

        function renderIntro(data) {
            let totalItems = 0;
            data.categories.forEach(cat => totalItems += cat.items.length);

            const introSection = document.createElement('div');
            introSection.className = 'section-block intro-block tracker-section';
            introSection.dataset.title = "Введение";
            introSection.dataset.index = 0;
            introSection.id = "section-0";

            let tocHtml = `<div class="toc-list">`;
            data.categories.forEach((cat, index) => {
                const num = (index + 1).toString().padStart(2, '0');
                tocHtml += `
                    <a href="#section-${index + 1}" class="toc-item interactive-item">
                        <span>${cat.name}</span>
                        <span class="toc-num">ГЛАВА ${num}</span>
                    </a>
                `;
            });
            tocHtml += `</div>`;

            introSection.innerHTML = `
                <h2 class="intro-title">Монумент Гению</h2>
                <p class="intro-text">Этот архив — дань уважения выдающимся людям, составляющим истинную гордость нации. Здесь собраны имена великих творцов, мыслителей, ученых и первооткрывателей, чей монументальный труд, непоколебимая воля и прозрения необратимо изменили ход мировой истории. Их колоссальное наследие — это фундамент, на котором стоит современная цивилизация. Мы должны гордиться ими.</p>
                <div class="intro-stats">СЕЙЧАС В СПИСКЕ: ${totalItems}</div>
                ${tocHtml}
            `;
            rightCol.appendChild(introSection);
        }

        function renderData(data) {
            data.categories.forEach((category, index) => {
                const section = document.createElement('div');
                section.className = 'section-block tracker-section';
                section.dataset.title = category.name;
                section.dataset.index = index + 1;
                section.id = `section-${index + 1}`;
                
                let html = `
                    <div class="section-divider">
                        ГЛАВА ${(index + 1).toString().padStart(2, '0')}
                        <span>${category.name}</span>
                    </div>
                `;
                
                category.items.forEach(item => {
                    const idStr = globalIndex.toString().padStart(3, '0');
                    
                    // Наполняем базу для шторки
                    if (item.id) {
                        itemsDatabase[item.id] = item;
                    }
                    
                    // Добавляем data-id для привязки клика
                    // Внутри category.items.forEach(item => { ...
                    html += `
                        <div class="item-row interactive-item" data-id="${item.id}">
                            <div class="item-content">
                                <div class="item-header">
                                    <span class="item-index">${idStr}</span>
                                    <div class="item-header-text">
                                        <h3 class="item-title">${item.name}</h3>
                                        <span class="item-achievement">${item.achievement}</span>
                                    </div>
                                </div>
                                <p class="item-desc">${item.description}</p>
                            </div>
                        </div>
                    `;
                    globalIndex++;
                });
                
                section.innerHTML = html;
                rightCol.appendChild(section);
            });
            
            initItemClicks();
        }

        // --- 4. ЛОГИКА OVERLAY (SPA) ---
        const overlay = document.getElementById('detail-overlay');
        const detailClose = document.getElementById('detail-close');
        
        function initItemClicks() {
            document.querySelectorAll('.item-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    const id = row.dataset.id;
                    if(id && itemsDatabase[id]) {
                        openDetailOverlay(itemsDatabase[id]);
                    }
                });
            });
        }

        function openDetailOverlay(data) {
            // Подтягиваем новое поле name вместо title
            document.getElementById('detail-title').innerText = data.name;
                
            // Подтягиваем achievement вместо invention
            document.getElementById('detail-invention').innerText = data.achievement ? data.achievement : 'ВЫДАЮЩИЙСЯ ВКЛАД';
                
            // Описание остается прежним
            document.getElementById('detail-full-desc').innerText = data.fullDescription ? data.fullDescription : data.description;
                
            // Фото
            const photoEl = document.getElementById('detail-photo');
            if (data.photo) {
                photoEl.src = data.photo;
                photoEl.style.display = 'block';
            } else {
                photoEl.style.display = 'none';
            }
        
            overlay.classList.add('active');
            document.body.classList.add('no-scroll');
        }

        detailClose.addEventListener('click', () => {
            overlay.classList.remove('active');
            document.body.classList.remove('no-scroll');
        });

        // --- 5. АНИМАЦИЯ БУКВ СЛЕВА ---
        const titleContainer = document.getElementById('category-title');
        const bgNumber = document.getElementById('bg-number');
        const catCounter = document.getElementById('cat-counter');
        
        let currentTitle = "";
        let animRequestId = 0; 

        function updateLeftPanel(newTitle, index) {
            if (currentTitle === newTitle) return;
            currentTitle = newTitle;
            
            animRequestId++;
            const currentReq = animRequestId;

            const numStr = index.toString().padStart(2, '0');
            const labelText = index === 0 ? 'ОГЛАВЛЕНИЕ' : `ГЛАВА ${numStr}`;
            
            bgNumber.style.opacity = '0';
            
            const oldChars = titleContainer.querySelectorAll('.char');
            oldChars.forEach((char, i) => {
                setTimeout(() => {
                    if (currentReq === animRequestId) char.classList.remove('visible');
                }, i * 10);
            });

            const delay = oldChars.length > 0 ? 400 : 0;

            setTimeout(() => {
                if (currentReq !== animRequestId) return;

                bgNumber.innerText = numStr;
                catCounter.innerText = labelText;
                bgNumber.style.opacity = '1';

                titleContainer.innerHTML = '';
                const wordsArray = newTitle.split(' ');
                
                wordsArray.forEach((wordText, wordIndex) => {
                    const wordDiv = document.createElement('div');
                    wordDiv.className = 'word';
                    
                    wordText.split('').forEach(letter => {
                        const span = document.createElement('span');
                        span.className = 'char';
                        span.innerText = letter;
                        wordDiv.appendChild(span);
                    });
                    
                    titleContainer.appendChild(wordDiv);

                    if (wordIndex < wordsArray.length - 1) {
                        const spaceDiv = document.createElement('div');
                        spaceDiv.className = 'word space';
                        titleContainer.appendChild(spaceDiv);
                    }
                });

                const newChars = titleContainer.querySelectorAll('.char');
                newChars.forEach((char, i) => {
                    setTimeout(() => {
                        if (currentReq === animRequestId) {
                            char.classList.add('visible');
                        }
                    }, i * 20); 
                });

            }, delay);
        }

        // --- 6. INTERSECTION OBSERVER ДЛЯ СКРОЛЛА ---
        function initIntersectionObserver() {
            const sections = document.querySelectorAll('.tracker-section');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const title = entry.target.dataset.title;
                        const index = parseInt(entry.target.dataset.index);
                        updateLeftPanel(title, index);
                    }
                });
            }, {
                rootMargin: "-50% 0px -50% 0px" 
            });

            sections.forEach(sec => observer.observe(sec));
        }

    });

    const searchInput = document.getElementById('archive-search');

    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const rows = document.querySelectorAll('.item-row');
        const sections = document.querySelectorAll('.section-block');

        rows.forEach(row => {
            const title = row.querySelector('.item-title').innerText.toLowerCase();
            // Фильтруем карточки
            if (title.includes(term)) {
                row.style.display = '';
                row.classList.add('blur-reveal', 'visible');
            } else {
                row.style.display = 'none';
            }
        });

        // Скрываем пустые секции
        sections.forEach(section => {
            const visibleItems = section.querySelectorAll('.item-row[style=""]');
            if (section.classList.contains('intro-block')) return; // Введение не трогаем

            if (visibleItems.length === 0) {
                section.style.display = 'none';
            } else {
                section.style.display = '';
            }
        });
    });
</script>
